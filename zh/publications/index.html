<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="詹锟在自动驾驶、多模态 AI、世界模型、三维视觉、规划与仿真方向的研究论文。"
    />
    <meta name="theme-color" content="#f4f1e9" />
    <title>研究论文 — 詹锟</title>
    <link rel="icon" href="../../assets/img/portrait.webp" type="image/webp" />
    <link rel="stylesheet" href="../../assets/css/site.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../"
          ><span class="brand__mark">KZ</span
          ><span class="brand__name">詹锟 · Kun Zhan</span></a
        >
        <nav
          class="site-nav"
          data-navigation
          data-open="false"
          aria-label="主导航"
        >
          <a href="../#about">个人介绍</a>
          <a href="../#milestones">重要事件</a>
          <a href="../#experience">个人经历</a>
          <a href="./" aria-current="page">研究论文</a>
          <a href="../updates/">最新动态</a>
        </nav>
        <div class="header-actions">
          <a class="language-link" href="../../publications/" lang="en">EN</a>
          <button
            class="icon-button"
            type="button"
            data-theme-toggle
            aria-label="切换配色"
          ></button>
          <button
            class="menu-button"
            type="button"
            data-menu-toggle
            aria-label="打开导航"
            aria-expanded="false"
          ></button>
        </div>
      </div>
    </header>

    <main id="main">
      <header class="page-hero reveal">
        <p class="eyebrow">研究档案 · 2014—2026</p>
        <h1>研究论文</h1>
        <div class="page-hero__footer">
          <p>
            完整、可搜索的研究成果列表，覆盖基座模型、自动驾驶、世界模型、多模态学习、三维视觉、规划与仿真。
          </p>
          <a
            class="text-link"
            href="https://scholar.google.com/citations?user=1J061HIAAAAJ&amp;hl=en"
            target="_blank"
            rel="noreferrer"
            >Google Scholar ↗</a
          >
        </div>
      </header>

      <section class="publication-tools" aria-label="论文筛选">
        <label>
          <span class="skip-link">搜索论文</span>
          <input
            type="search"
            data-publication-search
            placeholder="搜索标题、作者或会议期刊"
            autocomplete="off"
          />
        </label>
        <label>
          <span class="skip-link">按年份筛选</span>
          <select data-publication-year></select>
        </label>
        <span class="publication-tools__count" data-publication-count
          >正在载入论文…</span
        >
      </section>

      <section
        class="publication-list"
        data-publication-list
        data-source="../../data/publications.json"
        aria-live="polite"
      >
        <p class="empty-state">正在载入论文…</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 詹锟</span>
      <a href="../">返回首页</a>
    </footer>

    <script src="../../assets/js/content.js"></script>
    <script src="../../assets/js/site.js"></script>
    <script src="../../assets/js/publications.js"></script>
  </body>
</html>
