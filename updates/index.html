<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Recent model releases, talks, research, and professional milestones from Kun Zhan."
    />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Updates — Kun Zhan</title>
    <link rel="icon" href="../assets/img/portrait.webp" type="image/webp" />
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../"
          ><span class="brand__mark">KZ</span
          ><span class="brand__name">Kun Zhan</span></a
        >
        <nav
          class="site-nav"
          data-navigation
          data-open="false"
          aria-label="Primary navigation"
        >
          <a href="../#about">About</a>
          <a href="../#milestones">Milestones</a>
          <a href="../#experience">Experience</a>
          <a href="../publications/">Research</a>
          <a href="./" aria-current="page">Updates</a>
        </nav>
        <div class="header-actions">
          <a class="language-link" href="../zh/updates/" lang="zh-CN">中文</a>
          <button
            class="icon-button"
            type="button"
            data-theme-toggle
            aria-label="Change color theme"
          ></button>
          <button
            class="menu-button"
            type="button"
            data-menu-toggle
            aria-label="Open navigation"
            aria-expanded="false"
          ></button>
        </div>
      </div>
    </header>

    <main id="main">
      <header class="page-hero reveal">
        <p class="eyebrow">Current work · Short-form notes</p>
        <h1>Updates</h1>
        <div class="page-hero__footer">
          <p>
            A lightweight record of model releases, technical talks, research,
            and milestones. This is the living part of the site—without becoming
            a full blog.
          </p>
        </div>
      </header>
      <section
        class="updates-page-grid"
        data-updates
        aria-live="polite"
      ></section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Kun Zhan</span>
      <a href="../">Return home</a>
    </footer>
    <script src="../assets/js/content.js"></script>
    <script src="../assets/js/site.js"></script>
  </body>
</html>
