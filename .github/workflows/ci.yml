name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: npx prettier . --check

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python test dependencies
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Run pytest
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        run: pytest

      - name: Run rspec
        if: ${{ hashFiles('spec/**/*_spec.rb') != '' }}
        run: bundle exec rspec

      - name: No unit tests detected
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py', 'spec/**/*_spec.rb') == '' }}
        run: echo "No pytest or rspec test suites detected; skipping unit test execution."

  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update config for CI build
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip nbconvert

      - name: Build site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site
          retention-days: 1

  links:
    name: Link Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository links with lychee
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          args: --user-agent 'curl/7.54' --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --exclude-path _books/the_godfather.md --verbose --no-progress './**/*.md' './**/*.html'

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ci-artifacts/site-build

      - name: Normalize site artifact
        run: |
          rm -rf _site
          if [ -d ci-artifacts/site-build/_site ]; then
            mv ci-artifacts/site-build/_site _site
          else
            mv ci-artifacts/site-build _site
          fi

      - name: Check built site links with lychee
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - build
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ci-artifacts/site-build

      - name: Normalize site artifact
        run: |
          rm -rf _site
          if [ -d ci-artifacts/site-build/_site ]; then
            mv ci-artifacts/site-build/_site _site
          else
            mv ci-artifacts/site-build _site
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get Chromium version
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}

      - name: Install accessibility tooling
        run: |
          npm install -g chromedriver@${CHROMIUM_VERSION}
          npm install -g @axe-core/cli http-server

      - name: Run axe
        run: |
          http-server _site -p 8080 > /tmp/http-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 3

          for page in / /about/ /blog/ /projects/ /publications/ /cv/; do
            if [ "$page" = "/" ]; then
              file="_site/index.html"
            else
              file="_site${page}index.html"
            fi

            if [ -f "$file" ]; then
              axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" "http://127.0.0.1:8080${page}" --load-delay=1500 --exit
            else
              echo "Skipping missing page ${page}"
            fi
          done

  gate:
    name: CI Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - format
      - unit_tests
      - build
      - links
      - accessibility
    steps:
      - name: Verify required jobs
        run: |
          results=(
            "format:${{ needs.format.result }}"
            "unit-tests:${{ needs.unit_tests.result }}"
            "build:${{ needs.build.result }}"
            "links:${{ needs.links.result }}"
            "accessibility:${{ needs.accessibility.result }}"
          )

          for result in "${results[@]}"; do
            echo "$result"
            case "$result" in
              *:success)
                ;;
              *)
                echo "Required CI check failed: $result"
                exit 1
                ;;
            esac
          done
