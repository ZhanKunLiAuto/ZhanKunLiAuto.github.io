name: Propose Google Scholar Update

on:
  schedule:
    # Every Monday at 09:00 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for this manual refresh
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: scholar-update-${{ github.repository }}
  cancel-in-progress: false

env:
  PROFILE_UPDATE_EMAIL: ${{ vars.PROFILE_UPDATE_EMAIL || 'zk_1028@aliyun.com' }}
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
  SMTP_SECURITY: ${{ secrets.SMTP_SECURITY || 'ssl' }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Install update dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          npm ci

      - name: Collect Google Scholar candidate
        run: python bin/update_scholar.py

      - name: Format generated Scholar data
        run: npx prettier _data/scholar.yml --write

      - name: Detect generated changes
        id: changes
        run: |
          CHANGES="$(git status --porcelain -- _bibliography/papers.bib _data/scholar.yml assets/img/publication_preview)"
          if [ -z "$CHANGES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Google Scholar changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate email configuration
        if: steps.changes.outputs.changed == 'true'
        run: python bin/send_profile_update_email.py --check-config

      - name: Build review summary
        if: steps.changes.outputs.changed == 'true'
        run: python bin/profile_update_report.py --base HEAD --output "$RUNNER_TEMP/scholar-update-summary.md"

      - name: Run unit tests
        if: steps.changes.outputs.changed == 'true'
        run: pytest

      - name: Build site preview
        if: steps.changes.outputs.changed == 'true'
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Create candidate branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="automation/scholar-update-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add _bibliography/papers.bib _data/scholar.yml assets/img/publication_preview
          git commit -m "chore: propose Google Scholar update"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft review
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create scholar-update --color 1D76DB --description "Automated Google Scholar update" --force
          gh label create scholar-update:emailed --color 0E8A16 --description "Scholar confirmation email delivered" --force

          cp "$RUNNER_TEMP/scholar-update-summary.md" "$RUNNER_TEMP/scholar-update-pr.md"
          cat >> "$RUNNER_TEMP/scholar-update-pr.md" <<'EOF'

          ### 审核操作

          本 PR 只是 Google Scholar 候选更新。仓库所有者审阅差异后，评论精确的 `/approve` 才会发布；评论 `/reject` 可取消。

          合并前，审批工作流会验证操作者、分支、标签和候选状态。
          EOF

          PR_URL="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Google Scholar update proposal · $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/scholar-update-pr.md" \
            --label scholar-update \
            --draft)"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Email the update for confirmation
        if: steps.changes.outputs.changed == 'true'
        run: >-
          python bin/send_profile_update_email.py
          --status proposal
          --summary "$RUNNER_TEMP/scholar-update-summary.md"
          --review-url "${{ steps.pull_request.outputs.url }}"

      - name: Mark candidate as confirmable
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label scholar-update:emailed
          gh pr ready "$PR_NUMBER"

          gh pr list --state open --label scholar-update --json number --jq ".[] | select(.number != ${PR_NUMBER}) | .number" |
            while read -r OLD_PR; do
              [ -z "$OLD_PR" ] && continue
              gh pr close "$OLD_PR" --comment "Superseded by ${PR_URL}." --delete-branch
            done

      - name: Start CI for the candidate commit
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BRANCH"
