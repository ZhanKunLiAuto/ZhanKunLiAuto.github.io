name: Update Scholar Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Update Scholar content
        run: python bin/update_scholar.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- _bibliography/papers.bib _data/scholar.yml; then
            echo "No Scholar changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib _data/scholar.yml
          git commit -m "chore: refresh scholar data"
          git push origin HEAD:${{ github.ref_name }}
